name: Atualizar Dashboard AC Camargo

on:
  workflow_dispatch:
  schedule:
    - cron: "59 2 * * *"

permissions:
  contents: write

jobs:
  atualizar-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Gerar dashboard pelo Google Sheets
        run: python build_dashboard.py

      - name: Publicar atualização no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dashboard_data_summary.json
          if git diff --cached --quiet; then
            echo "Sem alterações para publicar."
          else
            git commit -m "Atualização automática do painel AC Camargo"
            git push
          fi
